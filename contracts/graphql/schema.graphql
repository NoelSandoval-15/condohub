"""
API GraphQL de Gestión (contexto Finanzas). Único GraphQL del sistema.
v1 mínima: solo lo necesario para probar login, roles y la regla F1. Aldana la amplía
(Unidad, Expensa, Cargo, morosos, mutations) siguiendo las reglas de contracts/CLAUDE.md.

Autorización (la hace Gestión con el rol del token de Keycloak):
  - salud:             cualquier rol autenticado.
  - estadoDeCuenta:    ADMIN (cualquier unidad) y RESIDENTE (solo su unidad, F1). GUARDIA no.
  - pagosPendientes:   solo ADMIN.
  - miPerfil:          cualquier rol autenticado (devuelve solo lo del propio token).
  - enlazarCuenta:     solo ADMIN.
  - morosos:           solo ADMIN (incluida la cuenta de servicio de n8n y Agentes).
  - emitirExpensas:    solo ADMIN.
  - registrarPago:     ADMIN (cualquier unidad) y RESIDENTE (solo su unidad, F1). GUARDIA no.
  - confirmarPago, rechazarPago: solo ADMIN.
Errores: `errors[].extensions.code` = código de la regla violada (ej. "F1") o FORBIDDEN / NOT_FOUND.
"""
schema {
  query: Query
  mutation: Mutation
}

"Dinero como string decimal con 2 decimales, ej. \"390.00\" (F10). Nunca número."
scalar Decimal

type Query {
  "Estado del servicio (\"hola\" del hito H1)."
  salud: Salud!

  "Estado de cuenta de una unidad. F1: el RESIDENTE solo puede pedir la suya."
  estadoDeCuenta(unidadId: ID!): EstadoDeCuenta!

  "Pagos en estado PENDIENTE, a la espera de conciliación (F8). Solo ADMIN."
  pagosPendientes: [Pago!]!

  "Quién soy: $sub y roles del token y, si la cuenta está enlazada a una persona (F1), sus datos y unidades. Un ADMIN o GUARDIA sin persona recibe personaId null y unidades vacías."
  miPerfil: Perfil!

  "Unidades morosas (F4: cargo vencido e impago), de mayor a menor deuda vencida, con el contacto del propietario titular. Solo ADMIN."
  morosos: [Moroso!]!
}

type Mutation {
  "Enlaza la cuenta de Keycloak (su sub) con una persona de Gestión (F1). Solo ADMIN. Repetir el mismo enlace no falla; una cuenta ya enlazada a otra persona, o una persona con otra cuenta, da F1."
  enlazarCuenta(personaId: ID!, keycloakSub: String!): PersonaCuenta!

  "Emite las expensas de un periodo (F3): una por unidad activa = presupuesto × alícuota, redondeada a 2 decimales, con la diferencia de redondeo en la unidad de mayor alícuota. Vencen el día configurado del mes (F4). Solo ADMIN. Errores: F2 si las alícuotas activas no suman 100 %; F3 si el periodo ya fue emitido, es un mes pasado o el presupuesto no es válido; F10 si el presupuesto tiene más de 2 decimales."
  emitirExpensas(
    "Año-mes, ej. \"2026-11\"."
    periodo: String!
    presupuesto: Decimal!
  ): EmisionExpensas!

  "Registra el pago de una unidad a partir de su comprobante (F8): nace siempre PENDIENTE y solo el ADMIN lo confirma o rechaza después; nunca se confirma desde el cliente (F9). Idempotente (O1–O3): repetir la misma idempotencyKey devuelve el mismo pago que la primera vez, sin crear otro. Errores: F1 si un RESIDENTE registra para una unidad que no es suya; F8 si la fecha no es válida o es futura, o el banco no es válido; F10 si el monto no es mayor a 0 o tiene más de 2 decimales; O1 si la clave no es un UUID v4 o la hora del dispositivo no es válida; NOT_FOUND si la unidad no existe."
  registrarPago(
    unidadId: ID!
    monto: Decimal!
    "Fecha del comprobante, ISO-8601 (yyyy-MM-dd)."
    fechaPago: String!
    "Banco del comprobante (lo prellena el OCR; el residente lo revisa, F9)."
    banco: String
    "UUID v4 generado una sola vez en el dispositivo (O1)."
    idempotencyKey: ID!
    "Hora del dispositivo al crear la operación, ISO-8601 con zona (O1). Se guarda aparte de la del servidor."
    horaDispositivo: String
  ): Pago!

  "Confirma un pago PENDIENTE (F8): se imputa FIFO a los cargos pendientes de la unidad, primero los vencidos más antiguos (F7); el excedente queda como saldo a favor y se emite el recibo. Solo ADMIN. Errores: F8 si el pago ya no está PENDIENTE; NOT_FOUND si no existe."
  confirmarPago(pagoId: ID!): ConfirmacionPago!

  "Rechaza un pago PENDIENTE con motivo obligatorio (F8). No toca ningún cargo. Solo ADMIN. Errores: F8 si falta el motivo, supera 300 caracteres o el pago ya no está PENDIENTE; NOT_FOUND si no existe."
  rechazarPago(pagoId: ID!, motivo: String!): Pago!
}

"Resultado de confirmar un pago (F7, F8)."
type ConfirmacionPago {
  pago: Pago!
  "Número correlativo del recibo emitido (F8)."
  reciboNumero: Int!
  "Parte del pago aplicada a cargos (F7)."
  imputado: Decimal!
  "Excedente de este pago que quedó como saldo a favor de la unidad (F7)."
  saldoAFavor: Decimal!
}

"Resultado de emitir las expensas de un periodo (F3, F4)."
type EmisionExpensas {
  "Año-mes, ej. \"2026-11\"."
  periodo: String!
  presupuesto: Decimal!
  "Fecha de vencimiento de las expensas, ISO-8601 (yyyy-MM-dd) (F4)."
  fechaVencimiento: String!
  "Cantidad de expensas emitidas: una por unidad activa."
  unidades: Int!
  "Suma de las expensas emitidas; siempre igual al presupuesto (F3)."
  total: Decimal!
}

type PersonaCuenta {
  personaId: ID!
  nombre: String!
  keycloakSub: String!
}

type Salud {
  servicio: String!
  estado: String!
}

type EstadoDeCuenta {
  unidadId: ID!
  codigo: String!
  bloque: String!
  deudaTotal: Decimal!
  deudaVencida: Decimal!
  "Cantidad de expensas vencidas e impagas (R4 bloquea reservas con 2 o más)."
  expensasVencidas: Int!
  saldoAFavor: Decimal!
  moroso: Boolean!
}

enum EstadoPago {
  PENDIENTE
  CONFIRMADO
  RECHAZADO
}

type Pago {
  id: ID!
  unidadId: ID!
  monto: Decimal!
  "Fecha del comprobante, ISO-8601 (yyyy-MM-dd)."
  fechaPago: String!
  estado: EstadoPago!
  "Motivo del rechazo; solo cuando está RECHAZADO (F8)."
  motivoRechazo: String
}

type Perfil {
  "sub de Keycloak (el del token)."
  sub: String!
  "Roles de CondoHub del token (ADMIN, RESIDENTE, GUARDIA)."
  roles: [String!]!
  "Id de la persona en Gestión; null si la cuenta no está enlazada. Es el residenteId que usa el servicio IA."
  personaId: ID
  nombre: String
  "Unidades de las que es titular o residente vigente (F1)."
  unidades: [UnidadDePersona!]!
}

type UnidadDePersona {
  unidadId: ID!
  codigo: String!
  bloque: String!
  "true si es el propietario titular; false si es residente."
  titular: Boolean!
}

type Moroso {
  unidadId: ID!
  codigo: String!
  bloque: String!
  deudaVencida: Decimal!
  "Expensas vencidas e impagas (R4 bloquea reservas con 2 o más)."
  expensasVencidas: Int!
  "Datos del propietario titular, para enviar el recordatorio (G1)."
  propietarioNombre: String!
  propietarioEmail: String
  propietarioTelefono: String
}