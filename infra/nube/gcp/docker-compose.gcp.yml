# CondoHub en Google Cloud: Reservas (con su outbox y su saga y su Postgres), Servicio IA (con Mongo y el almacén S3) y Agentes,
# detrás de Caddy (HTTPS). Se usa solo, con el .env de infra (lo hace `desplegar.sh`):
#   docker compose --env-file ../../.env -f docker-compose.gcp.yml up -d --build
# Variables (infra/.env, ver gcp.env.example): DOMINIO (de esta VM), AZURE_DOMINIO (Keycloak y gateway) y RABBITMQ_HOST (la VM de Azure).
# El 5672 de RabbitMQ en Azure se abre solo a la IP de esta VM (S4: el outbox publica y la saga consume desde aquí).
# El almacén S3 no sale de esta VM: sus claves se generan al crear el .env (no son las de desarrollo del repo).

x-keycloak: &keycloak
  KEYCLOAK_ISSUER: https://auth.${AZURE_DOMINIO}/realms/condohub
  KEYCLOAK_JWKS: https://auth.${AZURE_DOMINIO}/realms/condohub/protocol/openid-connect/certs

services:
  postgres:                     # base propia de Reservas (ningún otro servicio la toca)
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../postgres/init:/docker-entrypoint-initdb.d:ro      # el rol y la base de reservas, con sus extensiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  reservas:
    build: ../../../services/reservas
    image: condohub-reservas:gcp
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment: &reservas-entorno
      <<: *keycloak
      APP_KEY: ${RESERVAS_APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: reservas
      DB_USERNAME: reservas
      DB_PASSWORD: reservas_dev                                 # la que crea infra/postgres/init; la base no sale de esta VM
      GESTION_GRAPHQL_URL: https://api.${AZURE_DOMINIO}/gestion/graphql   # R4 y F1: morosidad y unidad, por el gateway de Azure
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER:-condohub}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-condohub}
    expose: ["8082"]

  reservas-outbox:              # S4: publica el outbox de Reservas en RabbitMQ (misma imagen)
    image: condohub-reservas:gcp
    pull_policy: never          # la imagen la construye `reservas`; no existe en ningún registro
    restart: unless-stopped
    depends_on:
      reservas: { condition: service_healthy }
    environment: *reservas-entorno
    entrypoint: ["php", "artisan", "outbox:publicar"]
    healthcheck: { disable: true }

  reservas-saga:                # S1–S3: orquestador de la saga (misma imagen)
    image: condohub-reservas:gcp
    pull_policy: never
    restart: unless-stopped
    depends_on:
      reservas: { condition: service_healthy }
    environment: *reservas-entorno
    entrypoint: ["php", "artisan", "saga:consumir"]
    healthcheck: { disable: true }

  mongo:                        # bases `ia` y `agentes` (una por servicio); los scripts crean colecciones e índices
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ../../../services/ia/db/mongo-init.js:/docker-entrypoint-initdb.d/01-ia.js:ro
      - ../../../services/agentes/db/mongo-init.js:/docker-entrypoint-initdb.d/02-agentes.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

  minio:                        # almacén S3 de fotos, reportes y modelos (hoy SeaweedFS: docs/adr/0002-almacen-s3.md)
    image: chrislusf/seaweedfs:3.85
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json", "-ip=minio", "-ip.bind=0.0.0.0"]
    volumes:
      - minio_data:/data
      - ./generado/s3.json:/etc/seaweedfs/s3.json:ro            # claves al azar de `desplegar.sh`
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ia:
    build: ../../../services/ia
    image: condohub-ia:gcp
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment: &ia-entorno
      <<: *keycloak
      PERSISTENCIA: mongo
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ia
      ALMACEN_FOTOS: s3
      ALMACEN_REPORTES: s3
      S3_ENDPOINT: http://minio:9000
      S3_ENDPOINT_PUBLICO: https://almacen.${DOMINIO}   # el que ve el navegador en las URLs firmadas de los reportes
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-condohub}:${RABBITMQ_PASSWORD:-condohub}@${RABBITMQ_HOST}:5672/%2F
      MODELO_FACIAL: facenet
      TORCH_HOME: /models/torch                          # pesos de FaceNet: se descargan una vez y quedan en el volumen
      MODELO_PLACAS_FICHA: /modelos/modelo_placas.json
      MODELO_LECTURA_FICHA: /modelos/ficha_reconocedor.json
      LECTOR_PLACAS: onnx                                # POST /placas/leer: detector + lector global (.onnx subidos a ~/condohub/services/ia/modelos)
      LECTOR_PLACAS_DETECTOR: /modelos/yolov8n_placas_int8.onnx
      LECTOR_PLACAS_MODELO: /modelos/cct_xs_v2_global.onnx
      GESTION_GRAPHQL_URL: https://api.${AZURE_DOMINIO}/gestion/graphql
      LLM_PROVEEDOR: ${LLM_PROVEEDOR:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ia_modelos:/models                               # caché de Whisper y de FaceNet (se descargan la primera vez)
      - ../../../services/ia/modelos:/modelos:ro         # fichas (en git) y .onnx (del equipo, no van a git: I6)
    expose: ["8083"]

  ia-agrupamiento:              # I4: DBSCAN nocturno (02:00 hora de La Paz) con la misma imagen que ia
    image: condohub-ia:gcp
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      disable: true   # el job nocturno no sirve HTTP: heredaba el healthcheck del servicio ia y salía «unhealthy» sin estarlo
    depends_on: [ia]
    environment:
      <<: *ia-entorno
      TZ: America/La_Paz
      I4_CADA_SEGUNDOS: ${I4_CADA_SEGUNDOS:-}
      I4_MIN_APARICIONES: ${I4_MIN_APARICIONES:-3}
      I4_MIN_DIAS: ${I4_MIN_DIAS:-3}
      I4_REAVISO_CADA: ${I4_REAVISO_CADA:-0}
    command:
      - sh
      - -c
      - |
        while true; do
          if [ -n "$I4_CADA_SEGUNDOS" ]; then
            sleep "$I4_CADA_SEGUNDOS"
          else
            ahora=$(date +%s); proxima=$(date -d "02:00" +%s)
            [ "$proxima" -le "$ahora" ] && proxima=$(date -d "tomorrow 02:00" +%s)
            sleep $((proxima - ahora))
          fi
          python -m app.jobs.agrupar_desconocidos || echo "el job de I4 falló; se reintenta mañana"
        done

  agentes:                      # misiones (G1–G3) y monitoreo (G5); servidor MCP
    build: ../../../services/agentes
    image: condohub-agentes:gcp
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      <<: *keycloak
      PERSISTENCIA: mongo
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: agentes
      GESTION_GRAPHQL_URL: https://api.${AZURE_DOMINIO}/gestion/graphql
      CONDOHUB_SERVICIOS_SECRET: ${CONDOHUB_SERVICIOS_SECRET:-}   # el mismo del realm de Azure (cliente condohub-servicios)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELO: ${GROQ_MODELO:-openai/gpt-oss-120b}   # el 20b agota sus tokens razonando y devuelve vacío (finish_reason=length)
      RESERVAS_URL: http://reservas:8082                  # herramientas de solo lectura sobre Reservas (E6, C2)
      N8N_WEBHOOK_ALERTAS: ${N8N_WEBHOOK_ALERTAS:-http://n8n:5678/webhook/agente-alertas}
      N8N_WEBHOOK_RECORDATORIOS: ${N8N_WEBHOOK_RECORDATORIOS:-http://n8n:5678/webhook/agente-recordatorio}
    expose: ["8084"]

  n8n:                          # automatizaciones: eventos (correo y push), monitoreo diario y avisos del agente
    image: n8nio/n8n:1.64.0
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678/
      GENERIC_TIMEZONE: America/La_Paz
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs,crypto            # el flujo del push firma el token de Firebase con fs y crypto
      GUARDIA_EMAIL: ${GUARDIA_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      MAIL_REMITENTE: ${MAIL_REMITENTE:-}               # con Gmail debe ser la cuenta del SMTP
      CONTACTOS_UNIDADES: ${CONTACTOS_UNIDADES:-}
      CONDOHUB_SERVICIOS_SECRET: ${CONDOHUB_SERVICIOS_SECRET:-}
      MONEDA: ${MONEDA:-BOB}
    ports: ["127.0.0.1:5678:5678"]                      # solo la propia VM: al editor se entra por túnel SSH, nunca por Caddy
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../n8n/flows:/flows:ro
      - ../../secrets:/secrets:ro                       # firebase-sa.json (fuera de git; se copia a mano a esta VM)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:                        # HTTPS automático para reservas., ia. y agentes. de ${DOMINIO}
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [reservas, ia, agentes, minio]

volumes:
  pg_data:
  mongo_data:
  minio_data:
  n8n_data:
  ia_modelos:
  caddy_data:
